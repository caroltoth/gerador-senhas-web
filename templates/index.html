<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Web | Meu Portfólio</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas Seguras</h1>
        
        <a href="{{ url_for('historico') }}" class="history-link">
            Ver Histórico de Senhas Salvas
        </a>
        
        <form method="POST">
            <div class="form-group">
                <label for="servico">Serviço ou Site (Ex: Google):</label>
                <input type="text" id="servico" name="servico" placeholder="Onde esta senha será usada" 
                       value="{{ servico_nome if servico_nome else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="tamanho">Tamanho da Senha:</label>
                <input type="number" id="tamanho" name="tamanho" 
                       value="{{ tamanho_atual if tamanho_atual else 12 }}" min="6" max="30" required>
            </div>

            <div class="form-group">
                <label>Incluir:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="maiusculas" name="maiusculas" {% if maiusculas_checked %} checked {% endif %}> 
                    <label for="maiusculas">Letras Maiúsculas (A-Z)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="numeros" name="numeros" {% if numeros_checked %} checked {% endif %}>
                    <label for="numeros">Números (0-9)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="simbolos" name="simbolos" {% if simbolos_checked %} checked {% endif %}>
                    <label for="simbolos">Símbolos (!@#$)</label>
                </div>
            </div>

            <div class="form-group salvar-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="salvar_senha" name="salvar_senha" {% if salvar_checked %} checked {% endif %}>
                    <label for="salvar_senha">Salvar esta senha no histórico</label>
                </div>
            </div>

            <button type="submit">Gerar Senha</button>
        </form>

        {% if senha %}
        <div class="result-box">
            <span id="passwordOutput" class="password-display">{{ senha }}</span>
            <span class="copy-icon" onclick="copyPassword()">&#128203;</span>
            
            <p style="margin-top: 10px; font-weight: bold;">
                Força: <span id="forcaDisplay">{{ forca }}</span>
            </p>
        </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
